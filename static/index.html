<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault - Secure Document Management</title>

<style>
  :root {
  --primary: #7540A8;
  --dark: #352044;
  --purple: #9064BD;
  --lavender: #F1EAF8;
  --white: #FFFFFF;
  --gold: #D6B46A;
  --text: #352044;
  --border: #E5D9F0;
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--text);
  background: #F8F5FC;
}

/* LOGIN PAGE */
#loginBox {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px 18px;
  text-align: center;
  background: linear-gradient(135deg, #352044, #7540A8, #B69ACF);
}

#loginBox:before {
  content: "♙";
  display: grid;
  place-items: center;
  width: 82px;
  height: 82px;
  margin-bottom: 20px;
  border-radius: 25px;
  color: white;
  font-size: 40px;
  background: var(--gold);
}

#loginBox:after {
  content: "TRUSTVAULT";
  color: white;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

#loginBox input {
  width: min(100%, 390px);
  margin: 9px auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  font-size: 15px;
  outline: none;
}

#loginBox input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #D6B46A35;
}

/* BUTTONS */
button {
  padding: 11px 18px;
  border: 0;
  border-radius: 9px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s ease;
}

button:hover {
  background: var(--dark);
  transform: translateY(-2px);
  box-shadow: 0 5px 14px #35204430;
}

#loginBtn {
  width: min(100%, 390px);
  margin-top: 12px;
  padding: 14px;
  background: var(--gold);
  color: var(--dark);
  font-size: 16px;
}

#loginBtn:hover {
  background: #E5CA91;
}

/* DASHBOARD HEADER */
#appBox {
  min-height: 100vh;
}

#appBox > p:first-child {
  margin: 0;
  padding: 20px 4%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 15px;
  color: white;
  background: linear-gradient(100deg, #352044, #7540A8);
  box-shadow: 0 4px 16px #35204425;
}

#who {
  color: white;
}

#logoutBtn {
  background: var(--gold);
  color: var(--dark);
}

/* DASHBOARD SECTIONS */
#uploadBox,
#docs,
#grants,
#adminBox {
  width: min(1120px, calc(100% - 32px));
  margin: 22px auto;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: white;
  box-shadow: 0 5px 20px #3520440c;
}

#appBox > h2 {
  width: min(1120px, calc(100% - 32px));
  margin: 28px auto 16px;
  color: var(--dark);
  font-size: 23px;
}

#uploadBox h2,
#adminBox h2 {
  color: var(--primary);
}

/* SEARCH INPUTS */
#appBox > #q,
#appBox > #cat,
#appBox > #own,
#appBox > #since {
  padding: 11px;
  margin: 5px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--dark);
}

#appBox > #q {
  margin-left: max(16px, calc((100% - 1120px)/2));
}

#searchBtn {
  background: var(--gold);
  color: var(--dark);
}

/* TABLE DESIGN */
.scroll {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th {
  background: var(--lavender);
  color: var(--dark);
  font-weight: 700;
}

th, td {
  padding: 13px;
  border: 1px solid var(--border);
  text-align: left;
  font-size: 14px;
}

tr:hover td {
  background: #FAF7FD;
}

a {
  color: var(--primary);
  font-weight: 600;
}

/* MESSAGE */
#msg {
  color: #A16207;
  min-height: 1.2em;
  padding: 8px 15px;
}

/* MOBILE RESPONSIVE */
@media (max-width: 650px) {
  #appBox > p:first-child {
    justify-content: space-between;
    flex-wrap: wrap;
  }

  #uploadBox,
  #docs,
  #grants,
  #adminBox {
    padding: 14px;
  }

  #appBox > #q,
  #appBox > #cat,
  #appBox > #own,
  #appBox > #since,
  #searchBtn {
    display: block;
    width: calc(100% - 32px);
    margin: 9px auto;
  }

  #upcat {
    width: 100%;
    margin-top: 8px;
  }

  #upBtn {
    width: 100%;
    margin-top: 8px;
  }
}

</style>
</head>

<body>

<p id="msg" role="status" aria-live="polite"></p>

<!-- LOGIN PAGE -->

<section id="loginBox">

  <input
    id="u"
    placeholder="Enter username"
    autocomplete="username"
  >

  <input
    id="p"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <button id="loginBtn">Login to TrustVault →</button>

</section>

<!-- DASHBOARD -->

<section id="appBox" hidden>

  <p>
    Signed in as <b id="who"></b>
    <button id="logoutBtn">Logout</button>
  </p>

  <!-- UPLOAD -->

  <div id="uploadBox">

    <h2>📁 Upload Documents</h2>

    <input id="file" type="file">

    <input
      id="upcat"
      placeholder="Enter document category"
    >

    <button id="upBtn">⬆ Upload Document</button>

  </div>

  <!-- DOCUMENTS -->

  <h2>📂 My Documents</h2>

  <input id="q" placeholder="Search by name">

  <input id="cat" placeholder="Category">

  <input id="own" placeholder="Owner">

  <input id="since" type="date">

  <button id="searchBtn">🔍 Search</button>

  <div id="docs" class="scroll"></div>

  <!-- ACCESS MANAGEMENT -->

  <div id="grants" class="scroll"></div>

  <!-- ADMIN PANEL -->

  <section id="adminBox" hidden>

    <h2>⚙ Admin Dashboard</h2>

    <button data-p="/admin/audit">
      📊 All Activity
    </button>

    <button data-p="/admin/audit?result=denied">
      🚫 Refused Only
    </button>

    <button data-p="/admin/audit?kind=permissions">
      🔑 Permission Changes
    </button>

    <button data-p="/admin/flagged">
      ⚠ Flagged Users
    </button>

    <button data-p="/admin/audit/verify">
      ✔ Verify Audit Chain
    </button>

    <div id="adminOut" class="scroll"></div>

  </section>

</section>

<!-- ORIGINAL JAVASCRIPT FILE -->

<script src="/static/app.js"></script>

</body>
</html>
