<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
/* ===== Colours & sizes: edit only this block to retheme ===== */
:root{
  --bg:#070b16; --panel:rgba(20,28,48,.72); --panel2:rgba(30,41,68,.65); --line:rgba(212,175,55,.22);
  --text:#eef2fa; --muted:#9aa7c0;
  --gold:#d4af37; --gold2:#f5d77a; --ink:#1a1405;
  --accent:#f5d77a; --info:#60a5fa;
  --warn:#fbbf24; --danger:#f87171;
  --radius:18px; --gap:16px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f3ea; --panel:rgba(255,255,255,.9); --panel2:rgba(250,246,234,.95); --line:rgba(161,125,16,.3);
    --text:#1b2033; --muted:#6b7285;
    --gold:#a67c00; --gold2:#c99a1a; --ink:#ffffff;
    --accent:#8a6500; --info:#1d4ed8;
    --warn:#92400e; --danger:#b91c1c;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55;
  max-width:1040px; margin:0 auto; padding:0 16px 56px; min-height:100vh;
  background:
    radial-gradient(900px 500px at 85% -5%, rgba(212,175,55,.16), transparent 60%),
    radial-gradient(800px 500px at -10% 10%, rgba(96,165,250,.12), transparent 60%),
    var(--bg);
  color:var(--text);
}
/* Sticky brand bar */
h1{
  position:sticky; top:0; z-index:5;
  margin:0 -16px 22px; padding:16px 20px;
  font-family:Georgia,"Times New Roman",serif; font-size:1.7rem; letter-spacing:.14em; text-transform:uppercase;
  background:linear-gradient(90deg,var(--gold2),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  display:flex; align-items:center; gap:12px;
}
h1::before{content:"🔐"; font-size:1.5rem; -webkit-text-fill-color:initial}
h2{
  margin:0 0 14px; font-size:.95rem; font-weight:700; color:var(--accent);
  text-transform:uppercase; letter-spacing:.14em; display:flex; align-items:center; gap:10px;
}
h2::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}

#msg{
  margin:0 0 var(--gap); padding:12px 16px; border-radius:12px;
  background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.4);
  border-left:4px solid var(--warn); color:var(--warn); font-weight:600;
  animation:pop .25s ease;
}
#msg:empty{display:none}
@keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}

/* Glass cards */
#loginBox,#appBox,#uploadBox,#adminBox{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 18px 50px rgba(0,0,0,.28);
  animation:pop .35s ease;
}
#loginBox{max-width:440px; margin:9vh auto 0; padding:30px; display:flex; flex-direction:column; gap:12px; border-top:3px solid var(--gold)}
#appBox{padding:24px}
#uploadBox,#adminBox{background:var(--panel2); padding:18px; margin:0 0 22px; box-shadow:none}
#adminBox{margin-top:30px; border-left:4px solid var(--gold)}
#appBox > p{
  margin:0 0 20px; padding:10px 14px; border-radius:12px; background:var(--panel2);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--muted); border:1px solid var(--line);
}
#appBox > p b{color:var(--text)}
#appBox > p button{margin-left:auto}

/* Inputs */
input{
  font:inherit; padding:12px 16px; margin:4px 0; min-width:0;
  background:rgba(0,0,0,.25); color:var(--text);
  border:1px solid var(--line); border-radius:999px;
  transition:border-color .15s, box-shadow .15s;
}
@media (prefers-color-scheme: light){ input{background:#fff} }
input::placeholder{color:var(--muted)}
input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.25)}
input[type=file]{border-radius:14px; padding:9px 12px; max-width:100%}
input[type=file]::file-selector-button{
  font:inherit; font-weight:600; margin-right:10px; padding:6px 14px; border:none; border-radius:999px;
  background:var(--gold); color:var(--ink); cursor:pointer;
}
#loginBox input{width:100%}
#appBox > input{width:calc(25% - 8px); min-width:130px; margin-right:6px}
#appBox > h2{margin-top:10px}

/* Buttons */
button{
  font:inherit; font-weight:700; cursor:pointer; letter-spacing:.02em;
  padding:11px 22px; margin:4px 3px;
  color:var(--ink); background:linear-gradient(135deg,var(--gold2),var(--gold));
  border:none; border-radius:999px;
  box-shadow:0 6px 18px rgba(212,175,55,.25);
  transition:transform .12s, box-shadow .15s, filter .15s;
}
button:hover{transform:translateY(-2px); filter:brightness(1.07); box-shadow:0 10px 24px rgba(212,175,55,.35)}
button:active{transform:none}
button:focus-visible{outline:2px solid var(--info); outline-offset:3px}
#logoutBtn{background:transparent; color:var(--text); border:1px solid var(--line); box-shadow:none; padding:7px 16px}
#logoutBtn:hover{background:rgba(248,113,113,.12); border-color:var(--danger); color:var(--danger); box-shadow:none}
#adminBox button[data-p]{background:transparent; color:var(--accent); border:1px solid var(--line); box-shadow:none}
#adminBox button[data-p]:hover{background:rgba(212,175,55,.12); box-shadow:none}
td button,#grants button{padding:6px 14px; font-size:.82rem; box-shadow:none}

a{color:var(--info); font-weight:600; text-decoration:none; border-bottom:1px dotted currentColor}
a:hover{border-bottom-style:solid}

/* Tables (generated by app.js) */
.scroll{overflow-x:auto; margin-top:var(--gap); border-radius:14px; border:1px solid var(--line)}
.scroll:empty{display:none}
table{border-collapse:collapse; width:100%; background:transparent}
th{
  background:rgba(212,175,55,.12); color:var(--accent);
  font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; white-space:nowrap;
}
th,td{border-bottom:1px solid var(--line); padding:12px 14px; text-align:left; font-size:.92rem; vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even) td{background:rgba(148,163,184,.05)}
tbody tr:hover td{background:rgba(212,175,55,.09)}

@media (max-width:640px){
  body{padding:0 12px 40px}
  h1{margin:0 -12px 16px; font-size:1.3rem; padding:14px 16px}
  #appBox{padding:14px}
  #appBox > input{width:100%; margin-right:0}
  #loginBox{margin-top:5vh; padding:22px}
}
</style>
</head>
<body>
<h1>TrustVault</h1>
<p id="msg" role="status"></p>

<section id="loginBox">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
</section>

<section id="appBox" hidden>
  <p>Signed in as <b id="who"></b> <button id="logoutBtn">Logout</button></p>

  <div id="uploadBox">
    <h2>Upload</h2>
    <input id="file" type="file">
    <input id="upcat" placeholder="category">
    <button id="upBtn">Upload</button>
  </div>

  <h2>Documents</h2>
  <input id="q" placeholder="name">
  <input id="cat" placeholder="category">
  <input id="own" placeholder="owner">
  <input id="since" type="date">
  <button id="searchBtn">Search</button>
  <div id="docs" class="scroll"></div>
  <div id="grants" class="scroll"></div>

  <section id="adminBox" hidden>
    <h2>Admin: activity</h2>
    <button data-p="/admin/audit">All activity</button>
    <button data-p="/admin/audit?result=denied">Refused only</button>
    <button data-p="/admin/audit?kind=permissions">Permission changes</button>
    <button data-p="/admin/flagged">Flagged users</button>
    <button data-p="/admin/audit/verify">Verify audit chain</button>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>
<script src="/static/app.js"></script>
</body>
</html>
