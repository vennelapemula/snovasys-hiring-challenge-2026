<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:16px;background:#f6f4ed;color:#263a30}
h1{color:#105c40;border-bottom:4px solid #c6a45d;padding-bottom:8px}
h2{color:#192820}
input,button{font-size:1rem;margin:3px;padding:8px;border-radius:8px;border:1px solid #d9dccf;background:#ffffff;color:#263a30}
button{background:#16845b;border-color:#16845b;color:#ffffff;cursor:pointer}
button:hover{background:#105c40}
a{color:#105c40;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#ffffff}
th{background:#192820;color:#f1dfb5}
th,td{border:1px solid #e8e8df;padding:6px 8px;text-align:left;font-size:.9rem}
#msg{color:#b45309;min-height:1.2em;font-weight:600}
</style>
</head>
<body>
<h1>TrustVault</h1>
<p id="msg" role="status"></p>

<section id="loginBox">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
</section>

<section id="appBox" hidden>
  <p>Signed in as <b id="who"></b> <button id="logoutBtn">Logout</button></p>

  <div id="uploadBox">
    <h2>Upload</h2>
    <input id="file" type="file">
    <input id="upcat" placeholder="category">
    <button id="upBtn">Upload</button>
  </div>

  <h2>Documents</h2>
  <input id="q" placeholder="name">
  <input id="cat" placeholder="category">
  <input id="own" placeholder="owner">
  <input id="since" type="date">
  <button id="searchBtn">Search</button>
  <div id="docs" class="scroll"></div>
  <div id="grants" class="scroll"></div>

  <section id="adminBox" hidden>
    <h2>Admin: activity</h2>
    <button data-p="/admin/audit">All activity</button>
    <button data-p="/admin/audit?result=denied">Refused only</button>
    <button data-p="/admin/audit?kind=permissions">Permission changes</button>
    <button data-p="/admin/flagged">Flagged users</button>
    <button data-p="/admin/audit/verify">Verify audit chain</button>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>
<script src="/static/app.js"></script>
</body>
</html>
