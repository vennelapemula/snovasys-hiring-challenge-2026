<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault - Secure Document Management</title>

<style>
:root {
  --navy: #172b4d;
  --teal: #087e8b;
  --teal-dark: #05616b;
  --coral: #e76f51;
  --bg: #f3f7fa;
  --white: #ffffff;
  --text: #243447;
  --muted: #64748b;
  --border: #dce5ed;
  --light: #eaf4f5;
  --danger: #d64545;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}

[hidden] {
  display: none !important;
}

/* HEADER */

.top-header {
  width: 100%;
  min-height: 90px;
  padding: 15px 35px;
  background: #172b4d;
  border-bottom: 4px solid #087e8b;

  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}

.brand h1 {
  color: white;
  margin: 0;
  font-size: 28px;
}

.brand p {
  color: #cbd8e8;
  margin: 5px 0 0;
  font-size: 13px;
}

.account-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 15px;
  color: white;
  margin-left: auto;
}

#logoutBtn {
  background: #e76f51;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 22px;
  font-weight: bold;
  cursor: pointer;
}

#logoutBtn:hover {
  background: #c9573d;
}

@media(max-width: 600px) {
  .top-header {
    padding: 12px;
    gap: 10px;
  }

  .brand h1 {
    font-size: 20px;
  }

  .account-area {
    gap: 7px;
    font-size: 11px;
  }

  #logoutBtn {
    padding: 9px 12px;
    font-size: 12px;
  }
}


</style>
</head>

<body>
  <header class="top-header">
  <div class="brand">
    <h1>🛡️ TrustVault</h1>
    <p>Secure Document Management</p>
  </div>

  <div class="account-area">
    <span>
      Signed in as <strong id="who"></strong>
    </span>
    <button type="button" id="logoutBtn">Logout</button>
  </div>
</header>



<main class="container">

  <p id="msg"></p>

  <!-- LOGIN SECTION -->
  <section id="loginBox" class="login-card" hidden>
    <h2>Welcome Back</h2>
    <p>Login to access your secure documents.</p>

    <label for="u">Username</label>
    <input id="u" type="text" placeholder="Enter username" autocomplete="username">

    <label for="p">Password</label>
    <input id="p" type="password" placeholder="Enter password" autocomplete="current-password">

    <button type="button" id="loginBtn">Login to TrustVault →</button>
  </section>

  <!-- APPLICATION -->
  <div id="appBox" hidden>

    <!-- UPLOAD DOCUMENT -->
    <section id="uploadBox" class="section-card">
      <h2 class="section-title">📤 Upload Document</h2>

      <div class="upload-row">
        <div class="field">
          <label for="file">Choose Document</label>
          <input id="file" type="file">
        </div>

        <div class="field">
          <label for="upcat">Document Category</label>
          <input id="upcat" type="text" placeholder="Example: Salary, Education, Personal">
        </div>

        <button type="button" id="upBtn">⬆ Upload Document</button>
      </div>
    </section>

    <!-- SEARCH DOCUMENTS -->
    <section class="section-card">
      <h2 class="section-title">🔍 Search Documents</h2>

      <div class="search-grid">
        <input id="q" type="text" placeholder="Document name">

        <input id="cat" type="text" placeholder="Category">

        <input id="own" type="text" placeholder="Owner">

        <div class="search-action">
          <input id="since" type="date" aria-label="From date">
          <button type="button" id="searchBtn">Search</button>
        </div>
      </div>

      <div id="docs"></div>
    </section>

    <!-- SHARING AND ACCESS -->
    <section class="section-card">
      <h2 class="section-title">🔐 Document Access</h2>
      <div id="grants">Select Access on a document to manage permissions.</div>
    </section>

    <!-- ADMIN -->
    <section id="adminBox" class="section-card" hidden>
      <h2 class="section-title">⚙️ Admin Activity</h2>

      <div class="admin-buttons">
        <button type="button" data-p="/admin/audit">All Activity</button>
        <button type="button" data-p="/admin/audit?result=denied">Refused Only</button>
        <button type="button" data-p="/admin/audit?kind=permissions">Permission Changes</button>
        <button type="button" data-p="/admin/flagged">Flagged Users</button>
        <button type="button" data-p="/admin/audit/verify">Verify Audit Chain</button>
      </div>

      <div id="adminOut"></div>
    </section>

  </div>
</main>

<footer>
  TrustVault © 2026 | Secure Document Management
</footer>

<script src="/static/app.js"></script>

</body>
</html>
