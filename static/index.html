<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:16px;
  background:linear-gradient(135deg,#1e1b4b,#0f766e);color:#0f172a;min-height:100vh}
h1{color:#fde68a;text-align:center;letter-spacing:1px}
h2{color:#1e1b4b;border-bottom:2px solid #fbbf24;padding-bottom:6px}
#loginBox,#appBox{background:#ffffff;border:3px solid #fbbf24;border-radius:16px;
  padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#loginBox{max-width:420px;margin:30px auto;text-align:center}
input{font-size:1rem;margin:4px;padding:9px;border-radius:8px;border:1px solid #a5b4fc;
  background:#f8fafc;color:#0f172a}
button{font-size:1rem;margin:3px;padding:8px 14px;border:none;border-radius:8px;
  color:#ffffff;cursor:pointer;background:#2563eb}
button:hover{filter:brightness(1.12)}
#loginBtn{background:#16a34a}
#logoutBtn{background:#dc2626}
#upBtn{background:#2563eb}
#searchBtn{background:#7c3aed}
#adminBox button{background:#d97706}
#docs button,#grants button{background:#0d9488}
a{color:#4338ca;font-weight:600}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#ffffff}
th{background:#312e81;color:#fde68a}
th,td{border:1px solid #c7d2fe;padding:6px 8px;text-align:left;font-size:.9rem}
#msg{color:#fef08a;min-height:1.2em;font-weight:600;text-align:center}
</style>
</head>
<body>
<h1>TrustVault</h1>
<p id="msg" role="status"></p>

<section id="loginBox">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
</section>

<section id="appBox" hidden>
  <p>Signed in as <b id="who"></b> <button id="logoutBtn">Logout</button></p>

  <div id="uploadBox">
    <h2>Upload</h2>
    <input id="file" type="file">
    <input id="upcat" placeholder="category">
    <button id="upBtn">Upload</button>
  </div>

  <h2>Documents</h2>
  <input id="q" placeholder="name">
  <input id="cat" placeholder="category">
  <input id="own" placeholder="owner">
  <input id="since" type="date">
  <button id="searchBtn">Search</button>
  <div id="docs" class="scroll"></div>
  <div id="grants" class="scroll"></div>

  <section id="adminBox" hidden>
    <h2>Admin: activity</h2>
    <button data-p="/admin/audit">All activity</button>
    <button data-p="/admin/audit?result=denied">Refused only</button>
    <button data-p="/admin/audit?kind=permissions">Permission changes</button>
    <button data-p="/admin/flagged">Flagged users</button>
    <button data-p="/admin/audit/verify">Verify audit chain</button>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>
<script src="/static/app.js"></script>
</body>
</html>
