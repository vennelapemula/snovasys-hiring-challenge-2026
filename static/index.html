<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
:root{
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--border:#e2e8f0;
  --primary:#2563eb;--primary-dark:#1d4ed8;--danger:#dc2626;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  max-width:960px;margin:0 auto;padding:24px 16px;
  background:var(--bg);color:var(--text);line-height:1.5}
h1{margin:0 0 20px;font-size:1.6rem;font-weight:700}
h2{margin:24px 0 12px;font-size:1.1rem;font-weight:600;
  padding-bottom:8px;border-bottom:1px solid var(--border)}
h3{font-size:1rem;margin:16px 0 8px}

#loginBox,#appBox{background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
#loginBox{max-width:380px;margin:40px auto}
#loginBox input{display:block;width:100%;margin:10px 0}
#loginBox button{width:100%;margin-top:8px}
#who{font-weight:600}

input{font:inherit;padding:9px 12px;margin:4px 4px 4px 0;
  border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text)}
input:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15)}

button{font:inherit;font-weight:500;padding:8px 14px;margin:4px 4px 4px 0;
  border:1px solid transparent;border-radius:8px;
  background:var(--primary);color:#fff;cursor:pointer;transition:background .15s}
button:hover{background:var(--primary-dark)}

#searchBtn,#adminBox button,#docs td button{
  background:#fff;color:var(--text);border-color:#cbd5e1}
#searchBtn:hover,#adminBox button:hover,#docs td button:hover{background:#f1f5f9}

#logoutBtn,#docs td button:last-of-type,#grants button{
  background:#fff;color:var(--danger);border-color:#fecaca}
#logoutBtn:hover,#docs td button:last-of-type:hover,#grants button:hover{
  background:#fef2f2}

a{color:var(--primary);font-weight:500;text-decoration:none;margin-right:8px}
a:hover{text-decoration:underline}

table{width:100%;border-collapse:collapse;background:#fff;
  font-size:.9rem;margin-top:8px}
th{background:#f8fafc;color:#475569;font-weight:600;
  text-transform:uppercase;font-size:.75rem;letter-spacing:.04em}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fafc}
#docs,#grants,#adminOut,.scroll{overflow-x:auto}

#msg{min-height:1.4em;margin:12px 0;color:#b45309;
  font-weight:500;text-align:center}

@media (max-width:600px){
  body{padding:12px 8px}
  #loginBox,#appBox{padding:16px}
  input{width:100%}
}
</style>
</head>
<body>
<h1>TrustVault</h1>
<p id="msg" role="status"></p>

<section id="loginBox">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
</section>

<section id="appBox" hidden>
  <p>Signed in as <b id="who"></b> <button id="logoutBtn">Logout</button></p>

  <div id="uploadBox">
    <h2>Upload</h2>
    <input id="file" type="file">
    <input id="upcat" placeholder="category">
    <button id="upBtn">Upload</button>
  </div>

  <h2>Documents</h2>
  <input id="q" placeholder="name">
  <input id="cat" placeholder="category">
  <input id="own" placeholder="owner">
  <input id="since" type="date">
  <button id="searchBtn">Search</button>
  <div id="docs" class="scroll"></div>
  <div id="grants" class="scroll"></div>

  <section id="adminBox" hidden>
    <h2>Admin: activity</h2>
    <button data-p="/admin/audit">All activity</button>
    <button data-p="/admin/audit?result=denied">Refused only</button>
    <button data-p="/admin/audit?kind=permissions">Permission changes</button>
    <button data-p="/admin/flagged">Flagged users</button>
    <button data-p="/admin/audit/verify">Verify audit chain</button>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>
<script src="/static/app.js"></script>
</body>
</html>
