<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
:root{
  --green:#15803d;
  --green-dark:#14532d;
  --green-deep:#064e3b;
  --mint:#dcfce7;
  --pale:#f0fdf4;
  --border:#bbf7d0;
  --white:#fff;
  --text:#14532d;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,#f0fdf4,#fff 55%,#e8f8ee);
}
input,button{
  font:inherit;
  border-radius:9px;
}
input{
  min-width:0;
  padding:11px 12px;
  border:1px solid #86cda0;
  background:#fff;
  color:var(--text);
  outline:none;
}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #16a34a20}
button{
  border:1px solid var(--green);
  padding:10px 16px;
  background:var(--green);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.15s ease;
}
button:hover{background:#166534;transform:translateY(-1px)}
a{color:var(--green)}
#msg{color:#b45309;min-height:1.2em;margin:0 0 12px;font-size:14px}

/* FIRST SCREEN: Login */
#loginBox{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
  text-align:center;
}
#loginBox:before{
  content:"♙";
  display:grid;
  place-items:center;
  width:76px;height:76px;
  margin-bottom:15px;
  border-radius:23px;
  color:#fff;
  font-size:38px;
  background:linear-gradient(145deg,#16a34a,#064e3b);
  box-shadow:0 12px 28px #064e3b2b;
}
#loginBox:after{
  content:"SECURE  •  PRIVATE  •  TRUSTED";
  order:-1;
  margin-bottom:12px;
  color:var(--green);
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
}
#loginBox input{
  display:block;
  width:min(100%,390px);
  margin:8px auto;
  padding:13px 14px;
  text-align:left;
}
#loginBox button{
  width:min(100%,390px);
  margin:8px auto;
  padding:13px;
  font-size:16px;
}
#loginBox input:first-of-type{margin-top:20px}
#loginBox:has(#msg:not(:empty)) #msg{width:min(100%,390px)}

/* Shared dashboard header */
#appBox{min-height:100vh}
#appBox>p:first-child{
  margin:0;
  padding:17px clamp(16px,4vw,48px);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:10px;
  color:#fff;
  background:linear-gradient(100deg,var(--green-deep),var(--green));
  box-shadow:0 4px 16px #064e3b25;
}
#who{color:#fff}
#logoutBtn{background:#fff;color:var(--green-dark);border-color:#fff;padding:8px 14px}
#logoutBtn:hover{background:var(--mint)}

/* Dashboard layout */
#uploadBox,#appBox>h2,#appBox>#q,#appBox>#cat,#appBox>#own,
#appBox>#since,#searchBtn,#docs,#grants,#adminBox{
  width:min(1120px,calc(100% - 32px));
  margin-left:auto;
  margin-right:auto;
}
#uploadBox,#docs,#grants,#adminBox{
  display:block;
  margin-top:20px;
  padding:20px;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(255,255,255,.94);
  box-shadow:0 5px 18px #064e3b0b;
}
#uploadBox h2,#appBox>h2,#adminBox h2{
  margin:0 0 14px;
  color:var(--green-dark);
  font-size:20px;
}
#file{max-width:100%}
#upcat{width:min(260px,100%)}
#upBtn{margin-left:6px}
#appBox>h2{
  margin-top:24px;
}
#appBox>#q,#appBox>#cat,#appBox>#own,#appBox>#since{
  width:auto;
  margin-top:0;
  margin-bottom:10px;
}
#appBox>#q{margin-left:max(16px,calc((100% - 1120px)/2))}
#searchBtn{width:auto;margin:0 max(16px,calc((100% - 1120px)/2));}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th{background:#dcfce7;color:var(--green-dark)}
th,td{
  border:1px solid var(--border);
  padding:10px 12px;
  text-align:left;
  font-size:.9rem;
}
#grants:empty,#docs:empty{display:none}
#adminBox{margin-bottom:36px}
#adminBox button{margin:3px}
#adminOut{margin-top:14px}
@media(max-width:650px){
  #appBox>p:first-child{justify-content:space-between;flex-wrap:wrap}
  #uploadBox,#docs,#grants,#adminBox{padding:14px}
  #upcat{width:100%;margin-top:8px}
  #upBtn{margin:8px 0 0;width:100%}
  #appBox>#q,#appBox>#cat,#appBox>#own,#appBox>#since{
    display:block;width:calc(100% - 32px);margin:8px auto;
  }
  #searchBtn{display:block;width:calc(100% - 32px);margin:8px auto}
}
</style>
</head>
<body>

<!-- FIRST SCREEN: original IDs and wording retained -->
<p id="msg" role="status"></p>
<section id="loginBox">
  <input id="u" placeholder="username" autocomplete="username">
  <input id="p" type="password" placeholder="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
</section>

<!-- SECOND SCREEN: hidden until the original app.js signs in -->
<section id="appBox" hidden>
  <p>Signed in as <b id="who"></b> <button id="logoutBtn">Logout</button></p>

  <div id="uploadBox">
    <h2>Upload</h2>
    <input id="file" type="file">
    <input id="upcat" placeholder="category">
    <button id="upBtn">Upload</button>
  </div>

  <h2>Documents</h2>
  <input id="q" placeholder="name">
  <input id="cat" placeholder="category">
  <input id="own" placeholder="owner">
  <input id="since" type="date">
  <button id="searchBtn">Search</button>
  <div id="docs" class="scroll"></div>
  <div id="grants" class="scroll"></div>

  <section id="adminBox" hidden>
    <h2>Admin: activity</h2>
    <button data-p="/admin/audit">All activity</button>
    <button data-p="/admin/audit?result=denied">Refused only</button>
    <button data-p="/admin/audit?kind=permissions">Permission changes</button>
    <button data-p="/admin/flagged">Flagged users</button>
    <button data-p="/admin/audit/verify">Verify audit chain</button>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>

<!-- Keep this original JavaScript path; it is required by your project. -->
<script src="/static/app.js"></script>
</body>
</html>
