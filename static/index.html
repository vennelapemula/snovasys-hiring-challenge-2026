<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault</title>
<style>
:root{
  --bg:#f1f5f9;--card:#ffffff;--text:#0f172a;--muted:#64748b;
  --border:#e2e8f0;--primary:#2563eb;--primary-dark:#1d4ed8;
  --danger:#dc2626;--nav:#0f172a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5}

header.top{background:var(--nav);color:#fff;padding:22px 16px;text-align:center}
header.top h1{margin:0;font-size:2.4rem;font-weight:700;letter-spacing:.5px}
header.top p{margin:4px 0 0;color:#94a3b8;font-size:.95rem}

main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}

#msg{min-height:0;margin:0 0 16px;padding:10px 14px;border-radius:8px;
  background:#fef3c7;color:#92400e;font-weight:500;text-align:center}
#msg:empty{display:none}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.08);margin-bottom:20px}
.card h2{margin:0 0 16px;font-size:1.1rem;font-weight:600;
  padding-bottom:10px;border-bottom:1px solid var(--border)}
.card h3{margin:20px 0 8px;font-size:1rem}

label{display:block;font-size:.85rem;font-weight:600;color:#334155;margin:0 0 4px}
input{font:inherit;width:100%;padding:9px 12px;border:1px solid #cbd5e1;
  border-radius:8px;background:#fff;color:var(--text)}
input:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37,99,235,.15)}
input[type=file]{padding:7px 10px;background:#f8fafc}

button{font:inherit;font-weight:500;padding:9px 16px;
  border:1px solid transparent;border-radius:8px;cursor:pointer;
  background:var(--primary);color:#fff;transition:background .15s}
button:hover{background:var(--primary-dark)}

/* login */
#loginBox{max-width:400px;margin:32px auto}
#loginBox h2{text-align:center;border:none;font-size:1.4rem;margin-bottom:8px;padding:0}
#loginBox .field{margin-top:16px}
#loginBox .pw{display:flex;gap:8px}
#loginBox .pw input{flex:1;min-width:0}
#togglePw{background:#fff;color:var(--text);border-color:#cbd5e1}
#togglePw:hover{background:#f1f5f9}
#loginBtn{width:100%;margin-top:22px;padding:11px}

/* app bar */
.bar{display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;margin-bottom:8px}
.bar p{margin:0}
#logoutBtn{background:#fff;color:var(--danger);border-color:#fecaca}
#logoutBtn:hover{background:#fef2f2}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:12px;align-items:end}
.grid button{width:100%}
.stack{margin-top:14px}

/* tables */
.scroll{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff}
th{background:#f8fafc;color:#475569;font-weight:600;font-size:.75rem;
  text-transform:uppercase;letter-spacing:.04em}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8fafc}
a{color:var(--primary);font-weight:500;text-decoration:none;margin-right:8px}
a:hover{text-decoration:underline}

#searchBtn,#adminBox button,#docs td button{
  background:#fff;color:var(--text);border-color:#cbd5e1;padding:6px 12px}
#searchBtn{padding:9px 16px}
#searchBtn:hover,#adminBox button:hover,#docs td button:hover{background:#f1f5f9}
#docs td button:last-of-type,#grants button{
  background:#fff;color:var(--danger);border-color:#fecaca;padding:5px 10px}
#docs td button:last-of-type:hover,#grants button:hover{background:#fef2f2}
#grants p{margin:6px 0}
#adminBox .btns{display:flex;flex-wrap:wrap;gap:8px}

@media (max-width:600px){
  header.top h1{font-size:2rem}
  .card{padding:16px}
}
</style>
</head>
<body>

<header class="top">
  <h1>TrustVault</h1>
  <p>Secure document sharing with an audit trail</p>
</header>

<main>
<p id="msg" role="status"></p>

<section id="loginBox" class="card">
  <h2>Login</h2>
  <div class="field">
    <label for="u">Username</label>
    <input id="u" autocomplete="username">
  </div>
  <div class="field">
    <label for="p">Password</label>
    <div class="pw">
      <input id="p" type="password" autocomplete="current-password">
      <button type="button" id="togglePw">Show</button>
    </div>
  </div>
  <button id="loginBtn">Login</button>
</section>

<section id="appBox" hidden>
  <div class="card">
    <div class="bar">
      <p>Signed in as <b id="who"></b></p>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div id="uploadBox" class="card">
    <h2>Upload</h2>
    <div class="grid">
      <div><label for="file">File</label><input id="file" type="file"></div>
      <div><label for="upcat">Category</label><input id="upcat" placeholder="e.g. salary"></div>
      <div><button id="upBtn">Upload</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Documents</h2>
    <div class="grid">
      <div><label for="q">Name</label><input id="q"></div>
      <div><label for="cat">Category</label><input id="cat"></div>
      <div><label for="own">Owner</label><input id="own"></div>
      <div><label for="since">Created since</label><input id="since" type="date"></div>
      <div><button id="searchBtn">Search</button></div>
    </div>
    <div id="docs" class="scroll"></div>
    <div id="grants" class="stack"></div>
  </div>

  <section id="adminBox" class="card" hidden>
    <h2>Admin: activity</h2>
    <div class="btns">
      <button data-p="/admin/audit">All activity</button>
      <button data-p="/admin/audit?result=denied">Refused only</button>
      <button data-p="/admin/audit?kind=permissions">Permission changes</button>
      <button data-p="/admin/flagged">Flagged users</button>
      <button data-p="/admin/audit/verify">Verify audit chain</button>
    </div>
    <div id="adminOut" class="scroll"></div>
  </section>
</section>
</main>

<script src="/static/app.js"></script>
<script>
(function () {
  var tp = document.getElementById("togglePw");
  var pw = document.getElementById("p");
  if (tp && pw) {
    tp.onclick = function () {
      var show = pw.type === "password";
      pw.type = show ? "text" : "password";
      tp.textContent = show ? "Hide" : "Show";
    };
    pw.addEventListener("keydown", function (e) {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });
  }
})();
</script>
</body>
</html>
