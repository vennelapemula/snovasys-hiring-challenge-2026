<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault - Secure Document Management</title>

<style>
:root {
  --navy: #172b4d;
  --teal: #087e8b;
  --teal-dark: #05616b;
  --coral: #e76f51;
  --bg: #f3f7fa;
  --white: #ffffff;
  --text: #243447;
  --muted: #64748b;
  --border: #dce5ed;
  --light: #eaf4f5;
  --danger: #d64545;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}

[hidden] {
  display: none !important;
}

/* HEADER */

.top-header {
  background: var(--navy);
  color: white;
  padding: 18px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  border-bottom: 4px solid var(--teal);
}

.brand h1 {
  margin: 0;
  font-size: 28px;
  letter-spacing: .4px;
}

.brand p {
  margin: 5px 0 0;
  color: #cbd8e8;
  font-size: 13px;
}

.account-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  flex-wrap: wrap;
}

#who {
  color: white;
  font-weight: 600;
  font-size: 14px;
}

/* MAIN */

.container {
  width: 92%;
  max-width: 1150px;
  margin: 22px auto;
}

#msg {
  margin: 10px 0;
  padding: 0;
  color: var(--teal-dark);
  font-weight: 600;
  text-align: center;
}

/* LOGIN */

.login-card {
  max-width: 430px;
  margin: 65px auto;
  padding: 30px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(23,43,77,.08);
}

.login-card h2 {
  color: var(--navy);
  margin: 0 0 8px;
}

.login-card p {
  color: var(--muted);
  margin-bottom: 22px;
}

/* SECTIONS */

.section-card {
  background: var(--white);
  padding: 20px 22px;
  margin: 16px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(23,43,77,.045);
}

.section-title {
  margin: 0 0 16px;
  padding-bottom: 10px;
  color: var(--navy);
  font-size: 21px;
  border-bottom: 2px solid var(--light);
  position: relative;
}

.section-title::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 65px;
  height: 3px;
  background: var(--teal);
}

/* INPUTS */

input, select {
  width: 100%;
  padding: 12px 13px;
  margin: 6px 0 12px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  background: white;
  color: var(--text);
  font-size: 14px;
  outline: none;
}

input:focus, select:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(8,126,139,.12);
}

label {
  display: block;
  font-weight: 600;
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
}

/* BUTTONS */

button {
  border: none;
  border-radius: 7px;
  padding: 11px 17px;
  background: var(--teal);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .2s ease;
}

button:hover {
  background: var(--teal-dark);
  transform: translateY(-1px);
}

button:disabled {
  opacity: .6;
  cursor: wait;
  transform: none;
}

#logoutBtn {
  background: var(--coral);
  color: white;
  padding: 11px 20px;
  font-weight: 700;
}

#logoutBtn:hover {
  background: #c9573d;
}

#loginBtn {
  width: 100%;
  background: var(--navy);
  margin-top: 8px;
}

#loginBtn:hover {
  background: #29466e;
}

.tv-delete {
  background: var(--danger) !important;
}

.tv-delete:hover {
  background: #ae3030 !important;
}

/* UPLOAD */

.upload-row {
  display: flex;
  align-items: end;
  gap: 12px;
  flex-wrap: wrap;
}

.upload-row .field {
  flex: 1;
  min-width: 220px;
}

.upload-row input {
  margin-bottom: 0;
}

.upload-row button {
  margin-bottom: 0;
}

/* SEARCH */

.search-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px 14px;
  align-items: end;
}

.search-grid input {
  margin: 0;
}

.search-action {
  display: flex;
  gap: 10px;
  align-items: center;
}

.search-action button {
  white-space: nowrap;
}

/* DOCUMENT TABLE */

#docs, #adminOut {
  width: 100%;
  overflow-x: auto;
}

#docs table, #adminOut table {
  width: 100%;
  min-width: 650px;
  border-collapse: collapse;
  margin-top: 15px;
  background: white;
}

#docs th, #docs td,
#adminOut th, #adminOut td {
  border: 1px solid var(--border);
  padding: 12px 10px;
  text-align: left;
  font-size: 13px;
  overflow-wrap: anywhere;
}

#docs th, #adminOut th {
  background: var(--navy);
  color: white;
  font-weight: 700;
}

#docs tr:nth-child(even),
#adminOut tr:nth-child(even) {
  background: #f5f9fc;
}

#docs td button {
  margin: 3px;
  padding: 8px 11px;
  font-size: 12px;
}

#docs td a {
  display: inline-block;
  background: var(--light);
  color: var(--teal-dark);
  padding: 8px 10px;
  border-radius: 6px;
  text-decoration: none;
  font-weight: 600;
}

#docs td a:hover {
  background: #d5ebed;
}

.tv-empty {
  padding: 20px;
  text-align: center;
  color: var(--muted);
}

/* ACCESS */

#grants {
  margin-top: 14px;
  padding: 12px;
  background: #f5f9fc;
  border-radius: 8px;
}

#grants p {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}

/* ADMIN */

.admin-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.admin-buttons button {
  background: var(--navy);
}

.admin-buttons button:hover {
  background: #29466e;
}

#adminOut {
  margin-top: 15px;
}

/* FOOTER */

footer {
  text-align: center;
  padding: 18px;
  margin-top: 25px;
  background: var(--navy);
  color: #dce5ed;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 650px) {
  .top-header {
    padding: 16px 5%;
  }

  .brand h1 {
    font-size: 24px;
  }

  .account-area {
    width: 100%;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.2);
  }

  .container {
    width: 94%;
    margin: 14px auto;
  }

  .section-card {
    padding: 16px 13px;
    margin: 12px 0;
  }

  .search-grid {
    grid-template-columns: 1fr;
  }

  .search-action {
    width: 100%;
  }

  .search-action button {
    width: 100%;
  }

  .upload-row {
    display: block;
  }

  .upload-row .field {
    min-width: 0;
  }

  .upload-row button {
    width: 100%;
    margin-top: 10px;
  }

  .login-card {
    margin: 35px auto;
    padding: 22px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="top-header">
  <div class="brand">
    <h1>🛡️ TrustVault</h1>
    <p>Secure Document Management</p>
  </div>

  <!-- USER AND LOGOUT AT RIGHT SIDE -->
  <div class="account-area" id="accountArea">
    <span>Signed in as <strong id="who"></strong></span>
    <button type="button" id="logoutBtn">Logout ↗</button>
  </div>
</header>

<main class="container">

  <p id="msg"></p>

  <!-- LOGIN SECTION -->
  <section id="loginBox" class="login-card" hidden>
    <h2>Welcome Back</h2>
    <p>Login to access your secure documents.</p>

    <label for="u">Username</label>
    <input id="u" type="text" placeholder="Enter username" autocomplete="username">

    <label for="p">Password</label>
    <input id="p" type="password" placeholder="Enter password" autocomplete="current-password">

    <button type="button" id="loginBtn">Login to TrustVault →</button>
  </section>

  <!-- APPLICATION -->
  <div id="appBox" hidden>

    <!-- UPLOAD DOCUMENT -->
    <section id="uploadBox" class="section-card">
      <h2 class="section-title">📤 Upload Document</h2>

      <div class="upload-row">
        <div class="field">
          <label for="file">Choose Document</label>
          <input id="file" type="file">
        </div>

        <div class="field">
          <label for="upcat">Document Category</label>
          <input id="upcat" type="text" placeholder="Example: Salary, Education, Personal">
        </div>

        <button type="button" id="upBtn">⬆ Upload Document</button>
      </div>
    </section>

    <!-- SEARCH DOCUMENTS -->
    <section class="section-card">
      <h2 class="section-title">🔍 Search Documents</h2>

      <div class="search-grid">
        <input id="q" type="text" placeholder="Document name">

        <input id="cat" type="text" placeholder="Category">

        <input id="own" type="text" placeholder="Owner">

        <div class="search-action">
          <input id="since" type="date" aria-label="From date">
          <button type="button" id="searchBtn">Search</button>
        </div>
      </div>

      <div id="docs"></div>
    </section>

    <!-- SHARING AND ACCESS -->
    <section class="section-card">
      <h2 class="section-title">🔐 Document Access</h2>
      <div id="grants">Select Access on a document to manage permissions.</div>
    </section>

    <!-- ADMIN -->
    <section id="adminBox" class="section-card" hidden>
      <h2 class="section-title">⚙️ Admin Activity</h2>

      <div class="admin-buttons">
        <button type="button" data-p="/admin/audit">All Activity</button>
        <button type="button" data-p="/admin/audit?result=denied">Refused Only</button>
        <button type="button" data-p="/admin/audit?kind=permissions">Permission Changes</button>
        <button type="button" data-p="/admin/flagged">Flagged Users</button>
        <button type="button" data-p="/admin/audit/verify">Verify Audit Chain</button>
      </div>

      <div id="adminOut"></div>
    </section>

  </div>
</main>

<footer>
  TrustVault © 2026 | Secure Document Management
</footer>

<script src="/static/app.js"></script>

</body>
</html>
